services:
  mongodb:
    image: mongo:7.0
    container_name: hezal_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hezal_market
    volumes:
      - mongo_data:/data/db
    networks:
      - hezal_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hezal_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/hezal_market
      FRONTEND_URL: http://localhost:80,http://localhost:5173
      JWT_SECRET: hezal_production_super_secret_jwt_key_9284719284719284
      JWT_EXPIRES_IN: 7d
      ADMIN_NAME: Platform Administrator
      ADMIN_EMAIL: admin@hezalmarket.com
      ADMIN_PASSWORD: AdminSecurePassword2026!
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
      COOKIE_SAME_SITE: lax
      COOKIE_SECURE: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hezal_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: hezal_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - hezal_network

volumes:
  mongo_data:
    driver: local

networks:
  hezal_network:
    driver: bridge
