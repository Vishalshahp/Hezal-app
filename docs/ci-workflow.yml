name: Hezal Market CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-ci:
    name: Backend API (Lint, Test & Security)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run ESLint
        run: cd server && npm run lint

      - name: Run backend automated tests
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://127.0.0.1:27017/hezal_market_test
          JWT_SECRET: ci_test_secret_key_849201938572019485720194
        run: cd server && npm test

  client-ci:
    name: Frontend SPA (Lint, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run ESLint
        run: cd client && npm run lint

      - name: Run frontend automated tests
        run: cd client && npm test

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: https://api.hezalmarket.com/api
        run: cd client && npm run build
